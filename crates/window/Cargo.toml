[package]
name = "xenon-window"
description = "The game window: shows the drawer's frames and reads an XInput controller and the keyboard. Thin glue over xenon-input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
font8x8 = { version = "0.3", default-features = false }
pollster = "0.4"
softbuffer = "0.4"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
winit = "0.30"
xenon-icon = { path = "../icon" }
xenon-input = { path = "../input" }
