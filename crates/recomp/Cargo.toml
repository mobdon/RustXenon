[package]
name = "xenon-recomp"
description = "Reads Xbox 360 executables (64-bit PowerPC) and writes Rust source that links against xenon-rt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aes = "0.8"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
toml = "0.8"
xenon-rt = { path = "../rt" }
