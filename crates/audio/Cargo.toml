[package]
name = "xenon-audio"
description = "Headless audio: decodes the console's compressed audio through a run-time loaded LGPL FFmpeg, mixes render-client frames, writes .wav files and plays them live."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Opens FFmpeg's shared libraries at run time, so nothing of FFmpeg is linked
# into our binaries (LGPL condition, see CREDITS.md).
libloading = "0.8"

# Live output to the default device: WASAPI on Windows, AAudio on Android
# (0.17 and later reach AAudio through the ndk crate, so an APK needs no
# libc++_shared.so as the older oboe backend did). Not on Linux, so builds
# there need no ALSA headers; elsewhere the speaker reports it is unavailable.
[target.'cfg(any(windows, target_os = "android"))'.dependencies]
cpal = "0.18"
