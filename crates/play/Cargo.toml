[package]
name = "xenon-play"
description = "The double-click launcher: lists built games, starts one and waits for it. The list, recent file, command line, settings and screen drawing are headless."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "rustxenon-play"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Only the launcher window uses these; the phone draws through the window crate.
[target.'cfg(not(target_os = "android"))'.dependencies]
png = "0.17"
softbuffer = "0.4"
winit = "0.30"
xenon-input = { path = "../input" }
