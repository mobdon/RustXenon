[package]
name = "xenon-gpu"
description = "Xenos GPU command recorder: parses PM4 packet streams from guest memory into a typed command list."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
# Frame bundles: a command list saved to a file and read back for offline replay.
bundle = ["dep:serde", "dep:serde_json"]
