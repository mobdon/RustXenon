[package]
name = "xenon-host"
description = "Host program: loads the player's own game files, runs recompiled code on xenon-rt, provides system call replacements."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sha1 = { version = "0.10", features = ["compress"] }
sha2 = "0.10"
xenon-draw = { path = "../draw" }
xenon-gpu = { path = "../gpu" }
xenon-input = { path = "../input" }
xenon-recomp = { path = "../recomp" }
xenon-rt = { path = "../rt" }
xenon-texture = { path = "../texture" }
xenon-window = { path = "../window" }
