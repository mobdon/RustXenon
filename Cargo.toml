[workspace]
resolver = "2"
members = ["crates/recomp", "crates/rt", "crates/host", "crates/cpu-tests"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
publish = false
repository = "https://github.com/mobdon/RustXenon"

[profile.dev]
# Generated guest code is large; keep debug builds usable.
opt-level = 1
