name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Software Vulkan (lavapipe) for the headless xenon-draw tests.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test
        env:
          XENON_REQUIRE_GPU: "1"
      # The drawer suites again with render targets at twice the guest
      # resolution: what the guest sees must not change.
      - run: cargo test -p xenon-draw --test draw --test kept --test formats --test edram
        env:
          XENON_REQUIRE_GPU: "1"
          XENON_SCALE: "2"
      # Game builds use target-cpu=native, which compiles in the FMA and
      # pshufb VMX paths; a fixed level that has them tests those paths here.
      - run: cargo test -p xenon-rt -p xenon-cpu-tests
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v3"
  ffmpeg:
    # Runs the audio tests against a freshly built LGPL-only FFmpeg, so the
    # decoder path is tested rather than skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/ffmpeg-lgpl/build.sh "$RUNNER_TEMP/ffmpeg"
      - run: cargo test -p xenon-audio
        env:
          XENON_FFMPEG_DIR: ${{ runner.temp }}/ffmpeg/lib
          XENON_REQUIRE_FFMPEG: "1"
